name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        torch-version: ["2.1.2", "latest"]
        exclude:
          - python-version: "3.12"
            torch-version: "2.1.2"
          - python-version: "3.13"
            torch-version: "2.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.torch-version }}" = latest ]; then T=torch; else T="torch==${{ matrix.torch-version }} numpy<2"; fi
          pip install $T --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -e ".[test]"
      - name: Test
        run: pytest -q
